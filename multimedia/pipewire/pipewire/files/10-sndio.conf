# Load the sndio spa plugin and create the sndio device.  The device
# announces the sink and source nodes and, through sioctl(3), exposes
# the sndiod output and input levels as routes so that desktop volume
# controls operate on the system volume.
# sio_open(3) honours $AUDIODEVICE; set api.sndio.path to select
# another device.
context.spa-libs = {
    api.sndio.*  = sndio/libspa-sndio
    audio.adapt* = audioconvert/libspa-audioconvert
}

context.objects = [
    { factory = spa-device-factory
        args = {
            factory.name       = api.sndio.device
            device.name        = "sndio-device"
            device.description = "sndio"
            #api.sndio.path    = "default"
            #api.sndio.buffer-msec = 50
        }
        flags = [ nofail ]
    }
]
