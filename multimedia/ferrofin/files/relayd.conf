# https://jellyfin.org/docs/general/post-install/networking/reverse-proxy/

http protocol "https" {
	match header set "X-Forwarded-For"   value "$REMOTE_ADDR"
	match header set "X-Forwarded-Proto" value "http"
	match header set "X-Forwarded-Host"  value "$HOST"

	http websockets
}

table <${PKGSTEM}> {
	${BIND_ADDR}
}

relay "${PKGSTEM}-tls" {
	listen on "::" port "https" tls
	protocol "https"

	forward to <${PKGSTEM}> port ${HTTP_PORT} \
	    check http "/health/live" code 200
}
